name: Build iOS IPA (self-signed, for TrollStore)

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Fetch Arc dependency
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Generate throwaway self-signed codesigning cert
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-tempkeychain
        run: |
          # Create a private key + self-signed cert good for code signing.
          # -addext extendedKeyUsage=codeSigning is required: without it, the cert
          # imports into the keychain fine but `security find-identity -p codesigning`
          # (which RoboVM uses to resolve -PsignIdentity) filters it out entirely,
          # since Apple's tooling only lists identities explicitly marked for code signing.
          openssl req -x509 -newkey rsa:2048 -keyout signing.key -out signing.crt \
            -days 365 -nodes -subj "/CN=iOS Development: Self Signer" \
            -addext "keyUsage=digitalSignature" \
            -addext "extendedKeyUsage=codeSigning"

          # Bundle into a .p12 so `security import` can load both key + cert together.
          # -legacy + explicit PBE-SHA1-3DES: OpenSSL 3.x defaults to AES-256 for .p12,
          # which macOS's `security` tool can't parse (fails with a misleading
          # "wrong password?" MAC-verification error). Force the old encryption
          # scheme Apple's Security framework actually understands.
          openssl pkcs12 -export -out signing.p12 \
            -inkey signing.key -in signing.crt -passout pass:tempp12pass \
            -legacy -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1

          # Fresh keychain so this doesn't touch the runner's default keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

          security import signing.p12 -k build.keychain -P tempp12pass \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # A self-signed cert has no chain to a real CA, so even with the correct
          # EKU it's filtered out of `find-identity -p codesigning` (shows as
          # "0 valid identities" even though it "matches" on paper). Explicitly
          # tell macOS to trust this specific cert as a root, for code-signing
          # purposes only. Needs sudo: this writes to the system-wide admin
          # trust store, which GitHub's macOS runners allow passwordlessly.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign signing.crt

          echo "=== Codesigning identities visible to RoboVM ==="
          security find-identity -v -p codesigning build.keychain

      - name: Generate matching homemade provisioning profile
        run: |
          UUID=$(uuidgen)
          cat > profile.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>UUID</key><string>${UUID}</string>
              <key>Name</key><string>Mindustry Self-Signed Profile</string>
              <key>AppIDName</key><string>Mindustry</string>
              <key>ApplicationIdentifierPrefix</key><array><string>SELFSIGN</string></array>
              <key>TeamIdentifier</key><array><string>SELFSIGN</string></array>
              <key>Entitlements</key>
              <dict>
                  <key>application-identifier</key><string>SELFSIGN.io.anuke.mindustry</string>
                  <key>get-task-allow</key><true/>
              </dict>
              <key>ProvisionsAllDevices</key><true/>
              <key>ExpirationDate</key><date>2035-01-01T00:00:00Z</date>
          </dict>
          </plist>
          PLIST

          security cms -S -N "iOS Development: Self Signer" \
            -k build.keychain \
            -i profile.plist -o mindustry.mobileprovision

      - name: Build & sign IPA
        run: |
          ./gradlew ios:createIPA \
            -PsignIdentity="iOS Development: Self Signer" \
            -PprovisioningProfile="mindustry.mobileprovision"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-ios-ipa
          path: ios/build/robovm/*.ipa
          retention-days: 14
